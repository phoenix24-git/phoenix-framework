name: Bug report
description: Something in Phoenix doesn't work as expected.
labels: [bug, triage]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the exact command (e.g. `phoenix run -d chrome`) and what you expected.
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: "1. phoenix create my_app\n2. ..."
    validations: { required: true }
  - type: textarea
    id: doctor
    attributes:
      label: "`phoenix doctor` output"
      render: text
    validations: { required: true }
  - type: input
    id: browser
    attributes:
      label: Browser and version (web issues)
      placeholder: Chrome 142 / Windows 11
