name: Feature request
description: Suggest an idea for Phoenix.
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to build, and what is missing today?
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How would you like it to work? Flutter/Godot/Bevy/O3DE precedent is welcome.
